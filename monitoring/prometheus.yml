global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Live tickets: the FastAPI app's /metrics endpoint, running on the host.
  - job_name: cloudserve_api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Batch runs: the harness pushes its metrics here at the end of each run.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
