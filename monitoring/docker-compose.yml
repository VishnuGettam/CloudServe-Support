# Live monitoring for CloudServe Support Triage: Prometheus + Pushgateway + Grafana.
#
#   cd monitoring
#   docker compose up -d
#
# Prometheus  http://localhost:9090   scrapes the API (/metrics) and the Pushgateway
# Pushgateway http://localhost:9091   receives metrics from harness runs (--pushgateway)
# Grafana     http://localhost:3000   dashboard "CloudServe Support Triage" (login admin / admin)
#
# The API must be running on the host, port 8000:
#   uv run uvicorn cloudserve_support.app.main:app --port 8000
# A harness run sends its metrics with:
#   uv run python -m cloudserve_support.harness --input ... --output ... --pushgateway http://localhost:9091

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Prometheus reach the API on the host (Linux; built in on Windows/Mac)
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports: ["9091:9091"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
