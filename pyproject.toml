[project]
name = "cloudserve-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vishnugettam", email = "vishnugettam@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
cloudserve-support = "cloudserve_support:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths=["tests"]
