[project]
name = "cloudserve-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vishnugettam", email = "vishnugettam@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.21",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
cloudserve-support = "cloudserve_support:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths=["tests"]
